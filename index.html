<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Api de Carros</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://kit.fontawesome.com/b39bb922a1.js" crossorigin="anonymous"></script>
    <script type="module" src="./controller/trocarbanner.js" defer></script>
</head>

<body>

    <header>
        <div id="Pesquisa">
            <input type="text" placeholder="Digite o carro que deseja procurar" id="Iput_Pesquisar">
            <button id="Pesquisar_lupa" onclick="BuscarCarros()">
                <i id="icon_search" class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        <!-- Here we'll develop the search bar-->
    </header>


    <section id="main_section">
        <nav id="box_car_Photo">
            <div id="photo_1" class="banner">
                <img class="photo_car_img" id="photo_1_img" src="" alt="Foto de frente">
            </div>
            <div id="photo_2" class="banner">
                <img class="photo_car_img" id="photo_2_img" src="" alt="Foto de lado">
            </div>
            <div id="photo_3" class="banner">
                <img class="photo_car_img" id="photo_3_img" src="" alt="Foto de cima">
            </div>
            <div id="photo_4" class="banner">
                <img class="photo_car_img" id="photo_4_img" src="" alt="Foto de tras">
            </div>
        </nav>

        <div id="trade_photos_buttons">
            <button id="trade_left" onclick="moverBanner(-1)">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button id="trade_right" onclick="moverBanner(1)">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <div id="box_car_description">
            <h1 id="car_name">CARRO TAL</h1>
            <h2 id="car_description">CARRO DESCRICAO BLLA BA BLA BAL BLA</h2>
        </div>
    </section>

    <section id="models_section">
        <div id="models"></div>
        <!-- Here we'll the 3D model -->
    </section>


    <footer>
        <div id="footer_content">
            <p>Desenvolvido por <strong>Artur Henrique Maso</strong> & <strong>Guilherme Zuchelli Felipetto</strong></p>
            <p>© 2026 - Todos os direitos reservados</p>
        </div>
        <!-- Here we'll have the credit creator's of the site-->
        <!-- here we'll have the part of feedback too -->
    </footer>
</body>

</html>
